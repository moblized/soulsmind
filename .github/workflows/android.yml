name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Android packaging tools
        # Rebuilding the man-db index after an install can stall Ubuntu runners for many minutes; skip it.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Build the APK
        # versionCode = 100 + run number. The app reads it from the release notes to decide whether to update.
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}" ./android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: soulsmind-apk
          path: build/soulsmind.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'versionCode: %s\n\nInstallable APK built from %s. The app offers this update by itself; to install by hand, open this page on your phone and tap soulsmind.apk.\n' \
            "$VERSION_CODE" "${GITHUB_SHA::7}" > notes.md
          gh release create "build-${GITHUB_RUN_NUMBER}" build/soulsmind.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Souls Mind ${VERSION_NAME}" \
            --notes-file notes.md \
            --latest
