name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Android packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Build the APK
        env:
          VERSION_CODE: ${{ 100 + github.run_number }}
          VERSION_NAME: 0.3.${{ github.run_number }}
        run: ./android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: soulsmind-apk
          path: build/soulsmind.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" build/soulsmind.apk \
            --title "Souls Mind 0.3.${{ github.run_number }}" \
            --notes "Installable APK built from ${GITHUB_SHA::7}. Open this page on your phone and tap soulsmind.apk." \
            --latest
